<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">  
    <title>معسكر الدور الثاني | كيمستوري</title>  
    <link rel="stylesheet" href="style.css">  
    <meta name="theme-color" content="#030812">  
    <link rel="icon" type="image/png" href="icon-192.png">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
</head>  
<body>  
<div class="ambient-glow"></div>

<header style="padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05);">  
    <div class="container" style="display: flex; align-items: center; justify-content: space-between;">  
        <a href="index.html" class="glass-panel" style="padding: 8px 15px; color: white; display: flex; align-items: center; gap: 8px;">  
            <i class="fas fa-arrow-right"></i> الرئيسية  
        </a>  
        <h3 style="font-family: 'Alexandria', sans-serif; color: white; margin: 0;">كيمستوري</h3>  
    </div>  
</header>  

<main class="container" style="padding-bottom: 50px;">  
    <div style="text-align: center; margin-bottom: 30px;">  
        <h2 style="font-family: 'Alexandria', sans-serif; color: white; font-size: 2em; margin-bottom: 10px;">  
            <i class="fas fa-fire-alt" style="color: var(--pink); text-shadow: 0 0 15px rgba(255,46,126,0.5);"></i>  
            معسكر الدور الثاني  
        </h2>  
        <p style="color: var(--muted);">خطة إنقاذ ٢٥ يوم (٢ أغسطس - ٢٧ أغسطس) 💪</p>  
    </div>  

    <div class="progress-dashboard glass-panel">  
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">  
            <span style="color: white; font-weight: bold; font-family: 'Alexandria', sans-serif;">مستوى الإنجاز:</span>  
            <span id="progress-percent" style="color: var(--sky); font-size: 1.5em; font-weight: 900; font-family: 'Alexandria', sans-serif;">0%</span>  
        </div>  
        <div class="progress-bar-container">  
            <div id="progress-bar-fill" class="progress-bar-fill"></div>  
        </div>  
        <p id="status-message" style="color: var(--muted); text-align: center; margin-top: 10px; font-size: 0.9em;">جاري حساب تقدمك...</p>  
    </div>  

    <!-- الجدول سيتم توليده هنا بواسطة الجافاسكريبت -->
    <div id="backlog-table-body" style="display: flex; flex-direction: column; gap: 10px;">  
    </div>  
</main>  

<script src="app.js"></script>
</body>  
</html>
